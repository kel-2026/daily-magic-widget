<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Little Daily Magic</title><style>*{box-sizing:border-box}body{margin:0;background:transparent;color:#f5e8cc;font-family:Georgia,'Times New Roman',serif}.card{position:relative;min-height:270px;padding:36px 32px;text-align:center;overflow:hidden;border:1px solid #9b7948;border-radius:17px;background:radial-gradient(ellipse at 50% 0%,#403051 0%,#201b31 45%,#100f1d 100%);box-shadow:inset 0 0 0 5px #191426,inset 0 0 0 6px #5c4860}.card:before,.card:after{content:'✧ ✦ ✧';position:absolute;left:0;right:0;color:#b79b70;letter-spacing:16px;font-size:13px}.card:before{top:12px}.card:after{bottom:12px}.eyebrow{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#c6a9d9;margin:10px 0 20px}.moon{font-size:29px;color:#dfc48a}.quote{font-size:clamp(20px,4vw,30px);line-height:1.45;max-width:680px;margin:16px auto 12px;font-style:italic;text-shadow:0 1px 12px #5b476f}.author{font-size:13px;letter-spacing:1px;color:#d3b989}.foot{margin-top:23px;color:#9f8bb6;font-size:12px;letter-spacing:2px}@media(max-width:440px){.card{padding:32px 20px}.eyebrow{letter-spacing:2px}}</style></head><body><div class="card"><div class="moon">☾ ✧ ☽</div><div class="eyebrow">A Little Daily Magic</div><div class="quote" id="quote"></div><div class="author" id="author"></div><div class="foot">✦ WORDS FROM THE ENCHANTED REALM ✦</div></div><script>const quotes=[['Even the longest night must surrender to the dawn.','An enchanted reminder'],['There is a little wilderness in every brave heart.','An enchanted reminder'],['Not every door is meant to be opened with a key.','An enchanted reminder'],['The stars have never asked permission to shine.','An enchanted reminder'],['Some magic grows quietly, like roots beneath the earth.','An enchanted reminder'],['A dragon does not apologise for its fire.','An enchanted reminder'],['The moon keeps her secrets, and so may you.','An enchanted reminder'],['Courage sometimes sounds like a whisper saying, try again.','An enchanted reminder'],['Where the forest grows wild, wonder is never far away.','An enchanted reminder'],['Even a small spell of kindness can change the day.','An enchanted reminder'],['The path may be hidden, but your next step is still yours.','An enchanted reminder'],['Some stories begin the moment you stop waiting.','An enchanted reminder'],['Let the ordinary world surprise you with its magic.','An enchanted reminder'],['Not all treasures glitter; some simply help us grow.','An enchanted reminder']];const now=new Date();const day=Math.floor(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())/86400000);const q=quotes[((day%quotes.length)+quotes.length)%quotes.length];document.getElementById('quote').textContent='“'+q[0]+'”';document.getElementById('author').textContent='— '+q[1];</script></body></html>
